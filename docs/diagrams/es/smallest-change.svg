<svg xml:lang="es" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La escalera del cambio mínimo completo">
  <desc>Escalera animada: un resaltado baja por cuatro pasos (¿hace falta?, ¿ya existe en el código?, ¿librería estándar o plataforma?, mínimo código nuevo) y se queda en el primero que funciona. Al lado, lo que nunca se recorta.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="430" fill="#0b0e14"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <text x="60" y="52" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#F7F6FC">El cambio mínimo completo</text>
  <text x="60" y="76" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#a1a1aa">Toma el primer paso que funcione del todo. Vago con la solución, nunca con terminarla.</text>

  <!-- moving highlight -->
  <rect x="56" y="100" width="728" height="62" rx="14" fill="none" stroke="url(#brand)" stroke-width="2.5">
    <animate attributeName="y" values="100;100;176;176;252;252;328;328" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(60,104)">
      <rect width="720" height="54" rx="12" fill="#161b22"/>
      <text x="20" y="34" font-size="20" font-weight="800" fill="#2dd4bf">1</text>
      <text x="52" y="25" font-size="15" font-weight="700" fill="#F7F6FC">¿Hace falta que exista?</text>
      <text x="52" y="43" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">omite features, opciones y código "para luego" no pedidos: nómbralos en una línea</text>
    </g>
    <g transform="translate(60,180)">
      <rect width="720" height="54" rx="12" fill="#161b22"/>
      <text x="20" y="34" font-size="20" font-weight="800" fill="#5eead4">2</text>
      <text x="52" y="25" font-size="15" font-weight="700" fill="#F7F6FC">¿Ya existe en el código?</text>
      <text x="52" y="43" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">mira el mapa del código y reutiliza el helper como lo usa el código de alrededor</text>
    </g>
    <g transform="translate(60,256)">
      <rect width="720" height="54" rx="12" fill="#161b22"/>
      <text x="20" y="34" font-size="20" font-weight="800" fill="#a5b4fc">3</text>
      <text x="52" y="25" font-size="15" font-weight="700" fill="#F7F6FC">¿Librería estándar o plataforma?</text>
      <text x="52" y="43" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">nunca añadas una dependencia por unas pocas líneas</text>
    </g>
    <g transform="translate(60,332)">
      <rect width="720" height="54" rx="12" fill="#161b22"/>
      <text x="20" y="34" font-size="20" font-weight="800" fill="#818cf8">4</text>
      <text x="52" y="25" font-size="15" font-weight="700" fill="#F7F6FC">Mínimo código nuevo</text>
      <text x="52" y="43" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">estilo y estructura existentes · actualiza cada llamador, test y fixture afectado</text>
    </g>

    <!-- never cut -->
    <rect x="830" y="104" width="310" height="282" rx="14" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="852" y="138" font-size="15" font-weight="800" fill="#fbbf24">Nunca recortar</text>
    <circle cx="1112" cy="132" r="5" fill="#fbbf24"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <g font-size="13" fill="#F7F6FC">
      <text x="852" y="176">✓ validar entradas externas</text>
      <text x="852" y="210">✓ errores que evitan perder datos</text>
      <text x="852" y="244">✓ seguridad</text>
      <text x="852" y="278">✓ accesibilidad</text>
      <text x="852" y="312">✓ todo lo que pidió el usuario</text>
    </g>
    <text x="852" y="360" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">shortcut: &lt;límite&gt;, &lt;cuándo mejorar&gt;</text>
  </g>
</svg>
