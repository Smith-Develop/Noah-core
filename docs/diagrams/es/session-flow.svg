<svg xml:lang="es" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cómo se carga Noah Core: hooks SessionStart y SubagentStart">
  <desc>Flujo animado: al iniciar la sesión, el hook lee SKILL.md, añade la nota de Graphify o el mapa del código por regex y lo inyecta en Claude. Los subagentes reciben solo las reglas de contexto y salida. Las sub-skills se cargan bajo demanda.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <path id="p1" d="M 260,110 L 340,110"/>
    <path id="p2" d="M 610,110 C 690,110 690,70 760,70"/>
    <path id="p3" d="M 610,110 C 690,110 690,160 760,160"/>
    <path id="p4" d="M 980,70 C 1010,70 1010,250 600,290"/>
    <path id="p5" d="M 980,160 C 1000,160 1000,260 600,290"/>
    <path id="p6" d="M 490,330 L 490,420"/>
    <path id="p7" d="M 600,300 C 820,300 820,420 860,430"/>
  </defs>
  <rect width="1200" height="520" fill="#0b0e14"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <!-- session start -->
    <rect x="30" y="76" width="230" height="68" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="50" y="106" font-size="15" font-weight="700" fill="#F7F6FC">Inicia la sesión</text>
    <text x="50" y="126" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">startup · resume · clear · compact</text>

    <!-- hook -->
    <rect x="340" y="70" width="270" height="80" rx="14" fill="#161b22" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="360" y="100" font-size="15" font-weight="700" fill="#F7F6FC">noah-session.js</text>
    <text x="360" y="120" font-family="Consolas, monospace" font-size="11" fill="#2dd4bf">lee skills/noah-core/SKILL.md</text>
    <text x="360" y="137" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">nivel: NOAH_LEVEL (lite/full/ultra)</text>

    <!-- branches -->
    <rect x="760" y="40" width="220" height="60" rx="12" fill="#161b22" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="778" y="66" font-size="13" font-weight="700" fill="#F7F6FC">¿Grafo de Graphify al día?</text>
    <text x="778" y="86" font-family="Consolas, monospace" font-size="11" fill="#a5b4fc">→ "usa graphify query"</text>
    <rect x="760" y="130" width="220" height="60" rx="12" fill="#161b22" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="778" y="156" font-size="13" font-weight="700" fill="#F7F6FC">Si no</text>
    <text x="778" y="176" font-family="Consolas, monospace" font-size="11" fill="#5eead4">→ mapa del código ≤2000 car.</text>

    <!-- claude -->
    <rect x="380" y="250" width="220" height="80" rx="16" fill="#161b22" stroke="url(#brand)" stroke-width="2"/>
    <text x="490" y="284" text-anchor="middle" font-size="17" font-weight="800" fill="url(#brand)">Claude Code</text>
    <text x="490" y="306" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">reglas + mapa en contexto</text>
    <circle cx="580" cy="266" r="4" fill="#2dd4bf"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>

    <!-- subagents -->
    <rect x="360" y="420" width="260" height="64" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="380" y="448" font-size="14" font-weight="700" fill="#F7F6FC">Subagentes</text>
    <text x="380" y="468" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">SubagentStart → solo secciones 1-2</text>

    <!-- on demand -->
    <rect x="860" y="390" width="300" height="94" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="880" y="418" font-size="14" font-weight="700" fill="#F7F6FC">Se cargan solo al usarlas</text>
    <text x="880" y="440" font-family="Consolas, monospace" font-size="11" fill="#a5b4fc">noah-plan · noah-review</text>
    <text x="880" y="458" font-family="Consolas, monospace" font-size="11" fill="#a5b4fc">noah-debt · noah-context</text>
    <text x="880" y="476" font-family="Consolas, monospace" font-size="10" fill="#71717a">~225-480 tokens cada una</text>
  </g>

  <g fill="none" stroke-width="1.3" stroke-dasharray="3 5">
    <use href="#p1" stroke="#2dd4bf" opacity="0.5"/>
    <use href="#p2" stroke="#818cf8" opacity="0.5"/>
    <use href="#p3" stroke="#2dd4bf" opacity="0.5"/>
    <use href="#p4" stroke="#818cf8" opacity="0.35"/>
    <use href="#p5" stroke="#2dd4bf" opacity="0.35"/>
    <use href="#p6" stroke="#a1a1aa" opacity="0.4"/>
    <use href="#p7" stroke="#a1a1aa" opacity="0.4"/>
  </g>
  <g>
    <circle r="3.5" fill="#5eead4"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="3.5" fill="#a5b4fc"><animateMotion dur="1.6s" begin="-0.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="3.5" fill="#5eead4"><animateMotion dur="1.6s" begin="-0.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="3.5" fill="#a5b4fc"><animateMotion dur="2.2s" begin="-1s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="3.5" fill="#5eead4"><animateMotion dur="2.2s" begin="-1s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
    <circle r="3" fill="#d4d4d8"><animateMotion dur="1.4s" begin="-0.2s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
    <circle r="3" fill="#d4d4d8"><animateMotion dur="2s" begin="-0.7s" repeatCount="indefinite"><mpath href="#p7"/></animateMotion></circle>
  </g>
</svg>
