<svg xml:lang="es" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decisión del adaptador de Graphify">
  <desc>Decisión animada: si existe graphify-out/graph.json, el comando graphify está en el PATH y el grafo es más nuevo que el último commit, Claude usa graphify query y se omite el mapa por regex. Si el grafo está desfasado, Claude usa grep. Si no, Noah no menciona Graphify e inyecta el mapa por regex.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <path id="a" d="M 230,190 L 330,190"/>
    <path id="b" d="M 530,190 L 630,190"/>
    <path id="c" d="M 830,190 C 880,190 880,90 930,90"/>
    <path id="d" d="M 830,190 C 880,190 880,290 930,290"/>
    <path id="e" d="M 430,230 C 430,330 600,340 930,340"/>
  </defs>
  <rect width="1200" height="380" fill="#0b0e14"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <text x="40" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#F7F6FC">Adaptador de Graphify: coste cero si no lo usas</text>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="40" y="150" width="190" height="80" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="60" y="184" font-size="14" font-weight="700" fill="#F7F6FC">existe graph.json</text>
    <text x="60" y="206" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">graphify-out/</text>

    <rect x="330" y="150" width="200" height="80" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="350" y="184" font-size="14" font-weight="700" fill="#F7F6FC">CLI en el PATH</text>
    <text x="350" y="206" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">graphify</text>

    <rect x="630" y="150" width="200" height="80" rx="14" fill="#161b22" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="650" y="184" font-size="14" font-weight="700" fill="#F7F6FC">¿Más nuevo que</text>
    <text x="650" y="206" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">el último commit?</text>

    <rect x="930" y="56" width="230" height="70" rx="14" fill="#161b22" stroke="#818cf8" stroke-width="1.5"/>
    <text x="950" y="86" font-size="14" font-weight="700" fill="#a5b4fc">Al día → consulta el grafo</text>
    <text x="950" y="108" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">sin mapa por regex</text>

    <rect x="930" y="256" width="230" height="58" rx="14" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="950" y="281" font-size="14" font-weight="700" fill="#fbbf24">Desfasado → usa grep</text>
    <text x="950" y="301" font-family="Consolas, monospace" font-size="11" fill="#a1a1aa">sugiere graphify update .</text>

    <text x="940" y="346" font-size="13" font-weight="700" fill="#5eead4">No → silencio + mapa regex</text>
  </g>
  <g fill="none" stroke-width="1.3" stroke-dasharray="3 5">
    <use href="#a" stroke="#a1a1aa"/><use href="#b" stroke="#a1a1aa"/>
    <use href="#c" stroke="#818cf8"/><use href="#d" stroke="#f59e0b"/><use href="#e" stroke="#2dd4bf"/>
  </g>
  <g>
    <circle r="3.5" fill="#d4d4d8"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
    <circle r="3.5" fill="#d4d4d8"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle>
    <circle r="3.5" fill="#a5b4fc"><animateMotion dur="1.4s" begin="-0.8s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle>
    <circle r="3.5" fill="#fbbf24"><animateMotion dur="1.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></circle>
    <circle r="3.5" fill="#5eead4"><animateMotion dur="2s" begin="-0.2s" repeatCount="indefinite"><mpath href="#e"/></animateMotion></circle>
  </g>
</svg>
